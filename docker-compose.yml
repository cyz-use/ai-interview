# =====================================================================
# AI 面试系统 v3.0 — Docker Compose 一键部署
# =====================================================================
#
# 使用方式:
#   1. 复制 .env.example 为 .env 并填入你的 API Key
#   2. docker-compose up -d
#   3. 浏览器访问 http://localhost:5173
#
# 服务组成:
#   - frontend:  React + TypeScript + Vite (端口 5173)
#   - backend:   FastAPI + LangGraph (端口 8000)
#   - postgres:  PostgreSQL 16 + pgvector (端口 5432)
#   - redis:     Redis 7 (端口 6379)
#   - minio:     MinIO 对象存储 (端口 9000/9001)
# =====================================================================

services:
  # ======================== 前端 ========================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE=http://backend:8000/api
    networks:
      - interview-network

  # ======================== 后端 ========================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://interview:interview@postgres:5432/interview_db
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - interview-network
    restart: unless-stopped

  # ======================== 数据库 ========================
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: interview_db
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interview_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - interview-network

  # ======================== 缓存 & 队列 ========================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - interview-network
    restart: unless-stopped

  # ======================== 对象存储 ========================
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    networks:
      - interview-network
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  interview-network:
    driver: bridge
